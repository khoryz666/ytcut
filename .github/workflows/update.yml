name: Update

# Every week: bump nixpkgs plus the Cargo and npm lockfiles, and push to main
# only if the app still builds. GitHub's own Dependabot handles actions.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start CI after pushing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      - run: nix develop -c cargo update
      - run: nix develop -c npm update --prefix src/web
      - run: nix build -L
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add flake.lock Cargo.lock src/web/package-lock.json
          git diff --cached --quiet && { echo "already up to date"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): weekly update'
          git push
          # A push made with GITHUB_TOKEN doesn't start other workflows, so start CI by hand.
          gh workflow run ci.yml --ref main
