name: Update dependencies

# Runs `cargo update` on a six-month cadence, verifies the build still passes,
# bumps the patch version, and pushes a tag that triggers the release workflow.
#
# yt-dlp, ffmpeg and Deno are deliberately excluded: they are fetched as
# "latest" at first run (src/tools.rs), and yt-dlp self-updates before every
# download because YouTube keeps breaking old versions.
#
# To let the pushed tag trigger `release.yml`, add a repository secret named
# `RELEASE_PAT` (a fine-grained PAT with Contents: read & write, or a classic
# `repo` scope PAT). GitHub's built-in `GITHUB_TOKEN` does not re-trigger
# workflows, so the push below authenticates with the PAT instead.

on:
  schedule:
    # Midnight UTC on the first day of every sixth month (Jan 1, Jul 1).
    - cron: '0 0 1 */6 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Update crate dependencies
        run: cargo update

      - name: Verify the update still builds and passes checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Detect changes
        id: changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        id: bump
        if: steps.changed.outputs.changed == 'true'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)
          new="$major.$minor.$((patch + 1))"
          sed -i "s/^version = \"$version\"/version = \"$new\"/" Cargo.toml
          sed -i "s/version = \"$version\"/version = \"$new\"/" flake.nix
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and push tag
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock flake.nix
          git commit -m "chore(deps): update dependencies to v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git"
          git push origin HEAD
          git push origin "v${{ steps.bump.outputs.new }}"
