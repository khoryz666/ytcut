name: Auto-release

# On the 5th of every month (after Dependabot has opened, tested, and merged
# its monthly updates) tag any unreleased changes and trigger the release build.
#
# Version rule: the version in Cargo.toml is the source of truth. If it is not
# yet tagged, it is released as-is (so a manual bump to 0.4.0 ships as 0.4.0).
# If it is already tagged, the patch is bumped and committed first.

on:
  schedule:
    - cron: '0 0 5 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')

          # Nothing to do if HEAD is exactly at the last tag.
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last_tag" ] && [ -z "$(git rev-list "$last_tag"..HEAD)" ]; then
            echo "No unreleased commits since $last_tag."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the current version is already tagged, bump the patch.
          if git rev-parse "v$version" >/dev/null 2>&1; then
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            version="$major.$minor.$((patch + 1))"
            sed -i "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
            sed -i "s/version = \".*\"/version = \"$version\"/" flake.nix
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.toml flake.nix
            git commit -m "chore(release): bump version to $version"
            git push
          fi

          git tag "v$version"
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release build
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --ref "v${{ steps.version.outputs.version }}" \
            -f tag="v${{ steps.version.outputs.version }}"
