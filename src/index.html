<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytcut</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e6;
    --accent: #e0312b; --accent-soft: #fdebea;
    font: 15px/1.45 system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #202023; --text: #f2f2f4; --muted: #9b9ba1; --line: #34343a; --accent-soft: #3b1f1e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 1rem;
    padding: .6rem 1rem; background: var(--card); border-bottom: 1px solid var(--line);
  }
  nav { display: flex; gap: .25rem; }
  nav a { padding: .4rem 1rem; border-radius: 999px; color: inherit; text-decoration: none; font-weight: 500; }
  nav a[aria-current] { background: var(--accent); color: #fff; }
  #now-nav { margin-left: auto; color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { max-width: 50rem; margin: 1.5rem auto; padding: 0 1rem; }
  section { display: grid; gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: .8rem; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  label { display: grid; gap: .3rem; font-weight: 500; }
  .hint { color: var(--muted); font-size: .85rem; font-weight: 400; margin: 0; }
  .error { color: var(--accent); margin: 0; }
  a { color: var(--accent); }
  .hint:empty, .error:empty { display: none; }

  input, button { font: inherit; color: inherit; }
  input:not([type=checkbox]) {
    width: 100%; min-width: 0; padding: .55rem .7rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  }
  input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }

  /* Two range inputs stacked on one track; only their handles take the mouse. */
  #cut { display: grid; gap: .4rem; }
  .range { --thumb: 18px; position: relative; height: 26px; }
  .range::before, .range .fill {
    content: ''; position: absolute; top: 11px; height: 4px; border-radius: 2px;
  }
  .range::before { left: 0; right: 0; background: var(--line); }
  .range .fill {
    background: var(--accent);
    left: calc(var(--thumb) / 2 + (100% - var(--thumb)) * var(--a, 0));
    right: calc(var(--thumb) / 2 + (100% - var(--thumb)) * (1 - var(--b, 1)));
  }
  .range input {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0;
    border: 0; background: none; pointer-events: none; appearance: none; -webkit-appearance: none;
  }
  .range input::-webkit-slider-runnable-track { height: 100%; background: none; }
  .range input::-moz-range-track { background: none; }
  .range input::-webkit-slider-thumb {
    -webkit-appearance: none; margin-top: 4px;
    width: var(--thumb); height: var(--thumb); border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card); cursor: grab; pointer-events: auto;
  }
  .range input::-moz-range-thumb {
    width: var(--thumb); height: var(--thumb); border-radius: 50%; box-sizing: border-box;
    background: var(--accent); border: 2px solid var(--card); cursor: grab; pointer-events: auto;
  }
  .range input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { padding: .45rem .9rem; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }

  #jobs li { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem 1rem; }
  #jobs li > :first-child { flex: 1; overflow-wrap: anywhere; }
  progress { width: 8rem; accent-color: var(--accent); }

  video { width: 100%; max-height: 60vh; background: #000; border-radius: 8px; }
  #now { flex: 1; }
  .select-all { display: flex; align-items: center; gap: .5rem; font-weight: 400; padding: 0 .5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  .song { display: flex; align-items: center; gap: .6rem; padding: .4rem .5rem; border-radius: 8px; }
  .song:hover { background: var(--bg); }
  .song.playing { background: var(--accent-soft); }
  .song .name { flex: 1; padding: 0; border: 0; background: none; text-align: left; overflow-wrap: anywhere; }
  .song .name:hover { color: var(--accent); }
  .song .size { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .song button:not(.name) { padding: .2rem .55rem; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <nav>
    <a href="#download">Download</a>
    <a href="#library">Library</a>
  </nav>
  <span id="now-nav"></span>
</header>

<main>
  <section id="download" hidden>
    <form class="card" id="dl-form">
      <label>YouTube link
        <input name="url" type="url" required autofocus placeholder="https://www.youtube.com/watch?v=…">
      </label>
      <p class="hint" id="info"></p>
      <label>File name
        <input name="name" placeholder="Same as the video title">
      </label>
      <div id="cut" hidden>
        <div class="row">
          <strong>Part to download</strong>
          <span class="hint" id="cut-label"></span>
        </div>
        <div class="range">
          <div class="fill"></div>
          <input name="start" type="range" min="0" step="1" aria-label="Start">
          <input name="end" type="range" min="0" step="1" aria-label="End">
        </div>
        <p class="hint">Drag the handles to keep only part. Arrow keys move 1 second.</p>
      </div>
      <button class="primary">Download</button>
      <p class="error" id="dl-error"></p>
    </form>
    <ul class="card" id="jobs" hidden></ul>
  </section>

  <section id="library" hidden>
    <div class="card" id="player" hidden>
      <video controls></video>
      <div class="row">
        <span class="hint" id="now"></span>
        <button id="prev" title="Previous">⏮</button>
        <button id="next" title="Next">⏭</button>
        <button id="shuffle" aria-pressed="false">🔀 Shuffle</button>
        <button id="stop" title="Stop and close the player">✕</button>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <input id="search" type="search" placeholder="Search videos" style="flex: 1">
        <button class="primary" id="play-selected" disabled>▶ Play selected</button>
      </div>
      <p class="hint">Click a name to play it on repeat. To loop several, tick them and press Play selected.</p>
      <label class="select-all"><input id="all" type="checkbox"> Select all</label>
      <ul id="songs"></ul>
      <p class="hint" id="empty"></p>
      <p class="error" id="lib-error"></p>
    </div>
  </section>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const el = (tag, props, ...children) => {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...children);
    return e;
  };
  const button = (textContent, onclick, props) => el('button', { type: 'button', textContent, onclick, ...props });
  const pad = (n) => String(n).padStart(2, '0');
  const clock = (s) => {
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
  };
  const megabytes = (bytes) => `${(bytes / 1048576).toFixed(1)} MB`;
  /** Error message nodes, with a sign-in link when YouTube asks to prove you are not a bot. */
  const errorNodes = (msg) => /sign in/i.test(msg)
    ? ['YouTube wants you to sign in. ',
       el('a', { href: 'https://www.youtube.com/', target: '_blank', textContent: 'Sign in to YouTube' }),
       ', then try again.']
    : [msg];

  /** GET when data is omitted, POST form fields otherwise. Throws the server's message on error. */
  async function request(path, data) {
    const res = await fetch(path, data && { method: 'POST', body: new URLSearchParams(data) });
    if (!res.ok) throw new Error(await res.text());
    return res.headers.get('content-type').startsWith('application/json') ? res.json() : res.text();
  }

  /* ---------- tabs ---------- */
  function showTab() {
    const tab = location.hash === '#library' ? 'library' : 'download';
    for (const id of ['download', 'library']) $('#' + id).hidden = id !== tab;
    for (const a of document.querySelectorAll('nav a')) a.toggleAttribute('aria-current', a.hash === '#' + tab);
    if (tab === 'library') loadFiles();
  }
  window.onhashchange = showTab;

  /* ---------- download ---------- */
  const form = $('#dl-form'), field = form.elements;
  let infoTimer, infoUrl, jobsTimer, running = 0;

  field.url.oninput = () => {
    clearTimeout(infoTimer);
    infoTimer = setTimeout(lookup, 400);
  };

  async function lookup() {
    const url = infoUrl = field.url.value.trim();
    field.name.placeholder = 'Same as the video title';
    showCut(null);
    $('#info').textContent = url && field.url.validity.valid ? 'Looking up video…' : '';
    if (!$('#info').textContent) return;
    try {
      const info = await request('/info?' + new URLSearchParams({ url }));
      if (url !== infoUrl) return;
      $('#info').textContent = info.title;
      field.name.placeholder = info.title;
      showCut(info.duration);
    } catch (e) {
      if (url === infoUrl) $('#info').replaceChildren(...errorNodes(e.message));
    }
  }

  /** Show the range slider for a video of this many seconds, or hide it when unknown. */
  function showCut(duration) {
    const max = Math.floor(duration || 0);
    $('#cut').hidden = max < 2;
    for (const input of [field.start, field.end]) input.max = max;
    field.start.value = 0;
    field.end.value = max;
    drawCut();
  }

  /** Keep start before end, then update the label and the filled part of the track. */
  function drawCut(moved) {
    const max = +field.end.max;
    if (+field.start.value >= +field.end.value) {
      if (moved === field.start) field.start.value = +field.end.value - 1;
      else field.end.value = +field.start.value + 1;
    }
    const start = +field.start.value, end = +field.end.value;
    $('#cut-label').textContent = start === 0 && end === max
      ? `Whole video · ${clock(max)}`
      : `${clock(start)} – ${clock(end)} · ${clock(end - start)}`;
    $('.range').style.setProperty('--a', max && start / max);
    $('.range').style.setProperty('--b', max && end / max);
    // Both handles can meet; keep the one that can still move on top.
    field.start.style.zIndex = start > max / 2 ? 1 : '';
  }
  field.start.oninput = () => drawCut(field.start);
  field.end.oninput = () => drawCut(field.end);

  form.onsubmit = async (e) => {
    e.preventDefault();
    // Untouched ends mean no cut, which also skips re-encoding.
    const data = new FormData(form);
    if ($('#cut').hidden || +field.start.value === 0) data.delete('start');
    if ($('#cut').hidden || field.end.value === field.end.max) data.delete('end');
    try {
      await request('/download', data);
      form.reset();
      lookup();
      $('#dl-error').textContent = '';
      pollJobs();
    } catch (err) {
      $('#dl-error').textContent = err.message;
    }
  };

  async function pollJobs() {
    clearTimeout(jobsTimer);
    const jobs = await request('/jobs');
    $('#jobs').hidden = !jobs.length;
    $('#jobs').replaceChildren(...jobs.map((j) => el('li', {},
      el('span', { textContent: (j.status === 'done' && j.message) || j.label }),
      j.status === 'running'
        ? el('progress', { max: 100, value: j.progress })
        : j.status === 'done'
          ? el('span', { className: 'hint', textContent: 'Saved ✓' })
          : el('span', { className: 'error' }, ...errorNodes(j.message || 'Download failed')),
    )));
    const now = jobs.filter((j) => j.status === 'running').length;
    if (now < running) loadFiles();
    running = now;
    if (now) jobsTimer = setTimeout(pollJobs, 1000);
  }

  /* ---------- library ---------- */
  const video = $('video');
  let files = [], selected = new Set(), queue = [], pos = 0, shuffle = false, failures = 0;

  async function loadFiles() {
    try {
      files = await request('/files');
    } catch (e) {
      $('#lib-error').textContent = e.message;
    }
    const names = new Set(files.map((f) => f.name));
    selected = new Set([...selected].filter((n) => names.has(n)));
    renderSongs();
  }

  function visibleFiles() {
    const q = $('#search').value.trim().toLowerCase();
    return files.filter((f) => f.name.toLowerCase().includes(q));
  }

  function renderSongs() {
    const list = visibleFiles();
    $('#songs').replaceChildren(...list.map(songRow));
    $('#empty').textContent = !files.length ? 'No videos yet. Download one first.'
      : !list.length ? 'No videos match your search.' : '';
    $('#all').checked = list.length > 0 && list.every((f) => selected.has(f.name));
    $('#all').parentElement.hidden = !list.length;
    $('#play-selected').disabled = !selected.size;
    $('#play-selected').textContent = `▶ Play selected (${selected.size})`;
  }

  function songRow(f) {
    const box = el('input', { type: 'checkbox', checked: selected.has(f.name), title: 'Select' });
    box.onchange = () => {
      box.checked ? selected.add(f.name) : selected.delete(f.name);
      renderSongs();
    };
    return el('li', { className: 'song' + (queue[pos] === f.name ? ' playing' : '') },
      box,
      button(f.name, () => playQueue([f.name]), { className: 'name', title: 'Play on repeat' }),
      el('span', { className: 'size', textContent: megabytes(f.size) }),
      button('Rename', () => renameSong(f.name)),
      button('Delete', () => deleteSong(f.name)),
    );
  }

  $('#search').oninput = renderSongs;
  $('#all').onchange = (e) => {
    for (const f of visibleFiles()) e.target.checked ? selected.add(f.name) : selected.delete(f.name);
    renderSongs();
  };
  $('#play-selected').onclick = () => playQueue(files.map((f) => f.name).filter((n) => selected.has(n)));

  /** Run a library action, show its error if any, then refresh the list. */
  async function act(fn) {
    try {
      await fn();
      $('#lib-error').textContent = '';
    } catch (e) {
      $('#lib-error').textContent = e.message;
    }
    await loadFiles();
  }

  function renameSong(name) {
    const base = name.replace(/\.[^.]+$/, '');
    const to = prompt('New name:', base);
    if (!to || to.trim() === base) return;
    act(async () => {
      const newName = await request('/rename', { name, to });
      if (selected.delete(name)) selected.add(newName);
      updateQueue(name, newName);
    });
  }

  function deleteSong(name) {
    if (!confirm(`Delete "${name}"?\nThis cannot be undone.`)) return;
    act(async () => {
      await request('/delete', { name });
      selected.delete(name);
      updateQueue(name);
    });
  }

  /* ---------- player ---------- */
  function playQueue(names) {
    queue = names;
    play(0);
  }


  function play(i, time = 0) {
    pos = i;
    $('#player').hidden = false;
    video.src = '/media/' + encodeURIComponent(queue[pos]);
    video.currentTime = time;
    video.play().catch(() => {});
    showNow();
  }

  function step(dir) {
    const n = queue.length;
    if (!n) return;
    play(shuffle && n > 1 ? (pos + 1 + Math.floor(Math.random() * (n - 1))) % n : (pos + dir + n) % n);
  }

  function stop() {
    queue = [];
    video.removeAttribute('src');
    video.load();
    $('#player').hidden = true;
    showNow();
  }

  /** Follow a renamed (newName given) or deleted file in the queue. */
  function updateQueue(name, newName) {
    const i = queue.indexOf(name);
    if (i < 0) return;
    if (newName) {
      queue[i] = newName;
      i === pos ? play(pos, video.currentTime) : showNow();
      return;
    }
    queue.splice(i, 1);
    if (!queue.length) return stop();
    if (i < pos) pos--;
    i === pos ? play(pos % queue.length) : showNow();
  }

  function showNow() {
    const name = queue[pos], many = queue.length > 1;
    $('#now').textContent = !name ? '' : many ? `${name} · ${pos + 1} of ${queue.length} · looping` : `${name} · on repeat`;
    $('#now-nav').textContent = name ? `♪ ${name}` : '';
    for (const id of ['#prev', '#next', '#shuffle']) $(id).hidden = !many;
    renderSongs();
  }

  video.onended = () => step(1);
  video.onplaying = () => { failures = 0; };
  video.onerror = () => {
    if (!queue.length) return;
    $('#now').textContent = `Can't play ${queue[pos]}.`;
    // Skip to the next song, but stop once every song in the loop has failed.
    if (queue.length > 1 && ++failures < queue.length) setTimeout(() => step(1), 1500);
  };
  $('#prev').onclick = () => step(-1);
  $('#next').onclick = () => step(1);
  $('#stop').onclick = stop;
  $('#shuffle').onclick = () => {
    shuffle = !shuffle;
    $('#shuffle').setAttribute('aria-pressed', shuffle);
  };

  // Tells the server this page is open, so it can stop once every window is closed.
  new EventSource('/alive');
  showTab();
  pollJobs();
</script>
</body>
</html>
