[package]
name = "ytcut"
version = "0.4.2"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"
open = "5"
ratatui = "0.29"
rodio = "0.23"
# Enable cpal's PulseAudio backend so audio routes through the system daemon
# (PulseAudio/PipeWire) and follows the default sink, e.g. Bluetooth.
cpal = { version = "0.18", features = ["pulseaudio"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
