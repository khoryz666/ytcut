[package]
name = "ytcut"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7"
mime_guess = "2.0.5"
open = "5"
rust-embed = "8.13.0"
self_update = { version = "1.3.3", default-features = false, features = [
    "archive-tar",
    "archive-zip",
    "checksums",
    "compression-tar-gz",
    "compression-tar-xz",
    "compression-zip-deflate",
    "github",
    "reqwest",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }

[profile.release]
strip = true
